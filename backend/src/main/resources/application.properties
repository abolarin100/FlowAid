
# ── central───────────────────────────────────────────────────────────────
spring.application.name=flowaid
spring.profiles.active=local

# ── Hikari Pool ───────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── FlowAid Config ────────────────────────────────────────────────────────────
flowaid.transfer.provider=${TRANSFER_PROVIDER:mock}
flowaid.transfer.mock.failure-rate=${MOCK_FAILURE_RATE:0.05}
flowaid.async.core-pool-size=4
flowaid.async.max-pool-size=10
flowaid.async.queue-capacity=500

# ── Retry / reliability (CashLink) ───────────────────────────────────────────
flowaid.retry.poll-interval-ms=${RETRY_POLL_INTERVAL_MS:30000}

# ── Eligibility engine (CashLink) ────────────────────────────────────────────
flowaid.eligibility.income-threshold-usd=${ELIGIBILITY_INCOME_THRESHOLD:150}
flowaid.eligibility.eligible-score-min=${ELIGIBILITY_SCORE_MIN:60}
flowaid.eligibility.review-score-min=${ELIGIBILITY_REVIEW_MIN:35}
flowaid.eligibility.high-need-zones=${ELIGIBILITY_HIGH_NEED_ZONES:Borno,Turkana,Cabo Delgado,Tigray,Kasai}

# ── Multi-provider transfer gateway (CrisisPay) — sandbox creds are free ────
# M-Pesa Daraja sandbox: register at developer.safaricom.co.ke
flowaid.transfer.mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
flowaid.transfer.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
flowaid.transfer.mpesa.shortcode=${MPESA_SHORTCODE:174379}
flowaid.transfer.mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
# Wave sandbox: register at wave.com/en/business/
flowaid.transfer.wave.api-key=${WAVE_API_KEY:}
flowaid.transfer.wave.base-url=${WAVE_BASE_URL:https://api.wave.com}

# ── Stripe (GiveFlow) — use TEST-mode keys, free, no charge until live ──────
flowaid.stripe.secret-key=${STRIPE_SECRET_KEY:}
flowaid.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
flowaid.stripe.default-amount-per-recipient-usd=${STRIPE_DEFAULT_AMOUNT_PER_RECIPIENT:50}

# ── Email receipts ────────────────────────────────────────────────────────────
# "log" (default, zero setup) just logs the email. Set to "smtp" + spring.mail.*
# properties (e.g. free Mailtrap/Ethereal sandbox creds) to actually send mail.
flowaid.email.provider=${EMAIL_PROVIDER:log}
flowaid.email.from=${EMAIL_FROM:no-reply@flowaid.org}

# ── Actuator / Monitoring ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── OpenAPI ───────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.flowaid=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n